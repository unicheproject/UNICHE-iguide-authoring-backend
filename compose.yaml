# Two services: the application and PostgreSQL. Asset bytes live on the `assets-data` volume (DECISIONS.md D-047).
#
# Keycloak and the UNICHE Catalogue are already deployed and are consumed as remote services, so they
# are never run locally. Their URLs come from `.env`; see `.env.example`.
#

name: iguide-authoring-backend

services:

  app:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the database is reached by service name, overriding whatever
      # localhost value `.env` carries for running the application straight from Maven.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iguide}
      ASSETS_DIR: /app/assets
      ASSETS_SIGNING_KEY: ${ASSETS_SIGNING_KEY:?set ASSETS_SIGNING_KEY in .env}
      ASSETS_PUBLIC_BASE_URL: ${ASSETS_PUBLIC_BASE_URL:-http://localhost:8080}
      # The labelled mock MuseMind translation for the local stack (DECISIONS.md D-035); never under prod.
      IGUIDE_AI_GATEWAY_MODE: ${IGUIDE_AI_GATEWAY_MODE:-mock}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        # Liquibase runs at application startup, so the database must already be accepting
        # connections rather than merely be started.
        condition: service_healthy
    volumes:
      - assets-data:/app/assets
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iguide}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Published for running the application from Maven or the IDE against this database. 5434, so it
    # clears a native PostgreSQL on 5432 and the MuseotekBox database on 5433.
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-iguide} -d ${POSTGRES_DB:-iguide}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  assets-data:
