# Three services: the application, PostgreSQL, and MinIO for asset bytes.
#
# Keycloak and the UNICHE Catalogue are already deployed and are consumed as remote services, so they
# are never run locally. Their URLs come from `.env`; see `.env.example`.
#
# MinIO is an S3-compatible store, so the application uses the same S3 client code path as in
# production. `10` section 7 says the local composition ships no storage service; the owner chose to ship
# one for development (DECISIONS.md D-025). The official MinIO images are no longer published, so this is
# Bitnami's frozen MinIO build, which also creates the private bucket at startup.

name: iguide-authoring-backend

services:

  app:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the database is reached by service name, overriding whatever
      # localhost value `.env` carries for running the application straight from Maven.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iguide}
      # The application reaches MinIO by service name; browsers follow signed URLs to the published port.
      ASSETS_S3_ENDPOINT: http://minio:9000
      ASSETS_S3_PUBLIC_ENDPOINT: ${ASSETS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ASSETS_S3_REGION: ${ASSETS_S3_REGION:-us-east-1}
      ASSETS_S3_BUCKET: ${ASSETS_S3_BUCKET:-iguide-assets}
      ASSETS_S3_ACCESS_KEY: ${ASSETS_S3_ACCESS_KEY:-iguide}
      ASSETS_S3_SECRET_KEY: ${ASSETS_S3_SECRET_KEY:-change-me-minio}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        # Liquibase runs at application startup, so the database must already be accepting
        # connections rather than merely be started.
        condition: service_healthy
      minio:
        # The application checks the bucket at startup.
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iguide}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Published for running the application from Maven or the IDE against this database. 5434, so it
    # clears a native PostgreSQL on 5432 and the MuseotekBox database on 5433.
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-iguide} -d ${POSTGRES_DB:-iguide}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${ASSETS_S3_ACCESS_KEY:-iguide}
      MINIO_ROOT_PASSWORD: ${ASSETS_S3_SECRET_KEY:-change-me-minio}
      # Created private: assets are read only through short-lived signed URLs (`07` section 10).
      MINIO_DEFAULT_BUCKETS: ${ASSETS_S3_BUCKET:-iguide-assets}
    # 9000 is the S3 API, which signed URLs name; 9001 is the MinIO console.
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
