# Every property here is recorded in the property contract table of the specification package
# (`10-runtime-config-and-deployment.md` section 3). Properties that vary by environment are read
# from an environment variable with a local-development default. Properties that are not an
# environment axis are hardcoded, including security controls. No default points at a production
# system, and no secret has a default.

server.port=${SERVER_PORT:8080}
# Per-tool path prefix on the platform. Not an environment axis.
server.servlet.context-path=/iguide

spring.application.name=iguide-backend

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iguide}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Liquibase owns the schema. `validate` fails startup when mappings and schema diverge, which is the
# point: it is the only reason Hibernate is allowed to look at the schema at all.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:}

# --- UNICHE platform ---
# Deliberately no defaults. An unset issuer or Catalogue URL must stop the application rather than
# let it start against the wrong platform instance.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${IDP_ISSUER_URI}
uniche.catalogue.base-url=${CATALOGUE_BASE_URL}
uniche.catalogue.connect-timeout=5s
uniche.catalogue.read-timeout=10s
# Identity of this tool in the Catalogue, sent when creating a Project.
uniche.tool.slug=${TOOL_SLUG:iguide}

iguide.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Asset storage (`10` sections 3 and 7) ---
# S3-compatible object storage in every environment. Deliberately no defaults: an unset value stops the
# application, and the bucket is checked with a head request at startup.
iguide.assets.s3.endpoint=${ASSETS_S3_ENDPOINT}
iguide.assets.s3.region=${ASSETS_S3_REGION}
iguide.assets.s3.bucket=${ASSETS_S3_BUCKET}
iguide.assets.s3.access-key=${ASSETS_S3_ACCESS_KEY}
iguide.assets.s3.secret-key=${ASSETS_S3_SECRET_KEY}
# The host that signed URLs name, when browsers reach the store under another address than this
# application does (local compose: `minio:9000` inside, `localhost:9000` outside). Empty means the
# endpoint above. Not in the property contract yet (DECISIONS.md D-025, QUESTIONS.md Q-014).
iguide.assets.s3.public-endpoint=${ASSETS_S3_PUBLIC_ENDPOINT:}
# Upload limits. The per-type values are development values; production sets them explicitly. A
# per-type limit above the global one fails startup.
iguide.assets.max-upload-bytes=209715200
iguide.assets.max-size.image=${ASSETS_MAX_SIZE_IMAGE:20971520}
iguide.assets.max-size.audio=${ASSETS_MAX_SIZE_AUDIO:52428800}
iguide.assets.max-size.video=${ASSETS_MAX_SIZE_VIDEO:209715200}
iguide.assets.max-size.document=${ASSETS_MAX_SIZE_DOCUMENT:20971520}
iguide.assets.max-size.three-d-model=${ASSETS_MAX_SIZE_THREE_D_MODEL:104857600}
iguide.assets.max-size.other=${ASSETS_MAX_SIZE_OTHER:20971520}
# Multipart parsing stops just above the global limit, so an oversized upload is refused before it is
# buffered; the per-type limit is checked by the upload itself.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
# A security control, not an environment axis: `env`, `beans`, and `heapdump` must never be reachable.
management.endpoints.web.exposure.include=health,info

# --- Logging ---
# Injects the correlation filter's per-request id into every log line, so an error response and its
# own log lines share one identifier.
logging.pattern.level=%5p [reqId=%X{requestId}]
