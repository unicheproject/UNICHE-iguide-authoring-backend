# Used by tests activating the `test` profile.
#
# There is no datasource here on purpose: a Testcontainers PostgreSQL instance supplies it, and the
# Liquibase changelog creates the schema exactly as it will in production. An in-memory database in
# PostgreSQL compatibility mode is not an option once Liquibase owns the schema, because JSONB, partial
# indexes, and Row-Level Security do not survive the substitution.
spring.jpa.hibernate.ddl-auto=validate

# Integration tests override this to point at the in-process stub realm, so the production security
# configuration is used unmodified and no test reaches the deployed IdP. The value here only exists so a
# context that does not need an issuer still binds.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://idp.invalid/realms/uniche

# Unroutable on purpose: any test that forgets to stub the Catalogue fails loudly rather than calling
# the real platform.
uniche.catalogue.base-url=http://localhost:1
uniche.tool.slug=iguide
iguide.cors.allowed-origins=http://localhost:5173

logging.level.org.springframework.web=WARN
